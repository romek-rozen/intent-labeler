[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "intent-labeler"
version = "0.4.0"
description = "Label search intent and recommended content form from a SERP or a set of pages, with transparent, code-computed metrics."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Roman Rozenberger" }]
keywords = ["seo", "search-intent", "serp", "llm", "content-strategy"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
extract = ["trafilatura>=2.0"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "python-multipart>=0.0.9"]

[project.scripts]
intent-labeler = "intent_labeler.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/intent_labeler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
