name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev,api,extract]'
      - run: pytest -q
